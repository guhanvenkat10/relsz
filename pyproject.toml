[project]
name = "relsz"
version = "0.2.0"
description = "Causal patient-relative channel-set seizure detector"
requires-python = ">= 3.10"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "torch==2.14.1", "epilepsy2bids==0.0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relsz"]
